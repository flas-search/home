<style>
:root{--bg:#f6f6f5;--card:#fff;--tx:#1d1d1f;--mu:#6b6b70;--ln:#e3e3e0;--ac:#3d4451}
@media(prefers-color-scheme:dark){:root{--bg:#161617;--card:#212123;--tx:#ececec;--mu:#9a9aa0;--ln:#333336;--ac:#c9ced8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
.w{max-width:720px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
h1{font-size:1.1rem;margin:0;letter-spacing:.5px;cursor:pointer}
.home{text-align:center;margin-top:18vh}
.home h1{font-size:2.2rem;margin-bottom:6px}
.home p{color:var(--mu);margin:0 0 24px}
form{display:flex;gap:8px}
input{flex:1;min-width:0;padding:13px 16px;border:1px solid var(--ln);border-radius:14px;background:var(--card);color:var(--tx);font-size:1rem;outline:none}
input:focus{border-color:var(--ac)}
button{padding:0 18px;border:0;border-radius:14px;background:var(--ac);color:var(--bg);font-size:1rem;cursor:pointer}
.ico{background:none;color:var(--mu);font-size:1.3rem;padding:4px 8px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-top:16px}
.card h2{font-size:.8rem;text-transform:uppercase;letter-spacing:1px;color:var(--mu);margin:0 0 8px}
.r{margin-top:18px}
.r a{color:var(--tx);font-size:1.05rem;text-decoration:none;font-weight:600}
.r a:hover{text-decoration:underline}
.r small{display:block;color:var(--mu);font-size:.78rem;word-break:break-all}
.r p{margin:2px 0 0;color:var(--mu);font-size:.92rem}
.src a{color:var(--ac);font-size:.85rem;margin-right:10px}
.muted{color:var(--mu);font-size:.9rem}
dialog{border:1px solid var(--ln);border-radius:16px;background:var(--card);color:var(--tx);width:min(92vw,420px)}
dialog input{width:100%;margin:6px 0 12px}
dialog label{font-size:.85rem;color:var(--mu)}
.row{display:flex;gap:8px;justify-content:flex-end}
.row button{padding:10px 16px}
.row .g{background:none;color:var(--mu)}
.lg{display:flex;align-items:center;gap:10px}
.lg img{width:30px;height:30px;border-radius:8px}
.home img{width:84px;height:84px;border-radius:20px;margin-bottom:12px}
.home h1{display:block}
.r a{display:flex;align-items:center;gap:8px}
.r a img{width:16px;height:16px;border-radius:3px;flex:none}
.more{display:block;margin:22px auto 0;padding:13px 28px;background:#dbe8fb;color:#1f3a66;font-weight:600}
@media(prefers-color-scheme:dark){.more{background:#2b3f5c;color:#d6e6ff}}
.tag{display:inline-block;font-size:.7rem;padding:1px 7px;margin-left:8px;border-radius:8px;background:#dbe8fb;color:#1f3a66;font-weight:600}
.chips{margin-top:26px;font-size:.85rem;color:var(--mu)}.chips a{color:var(--ac);margin:0 6px}
.w{max-width:860px}
.tabs{display:flex;gap:6px;margin-top:14px;overflow-x:auto}
.tabs button{background:none;color:var(--mu);padding:8px 16px;border:1px solid transparent;border-radius:12px;white-space:nowrap}
.tabs button.on{background:var(--card);color:var(--tx);border-color:var(--ln)}
.grid{columns:2 150px;column-gap:8px;margin-top:14px}@media(min-width:620px){.grid{columns:4}}
.grid img{width:100%;display:block;margin-bottom:8px;border-radius:10px;cursor:pointer;background:var(--ln)}
#view{position:fixed;inset:0;z-index:9;overflow:auto;padding:16px;background:var(--bg);display:none}
#view .big{max-width:100%;max-height:55vh;display:block;margin:12px auto;border-radius:12px}
#view .go{color:var(--ac);font-weight:600}
.chat{display:flex;gap:12px;margin-top:14px;height:calc(100vh - 150px);position:relative}
.side{width:210px;flex:none;overflow:auto;border-right:1px solid var(--ln);padding-right:10px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.msgs{flex:1;overflow:auto}
.m{margin:10px 0;padding:10px 14px;border-radius:14px;background:var(--card);border:1px solid var(--ln)}
.m.u{background:#dbe8fb;color:#1f3a66;margin-left:auto;width:fit-content;max-width:88%}
.ci{padding:8px 10px;border-radius:10px;cursor:pointer;font-size:.9rem;display:flex;justify-content:space-between;gap:6px}
.ci.on{background:var(--card)}.ci b{color:var(--mu);font-weight:400}
#tg{display:none}
@media(max-width:640px){#tg{display:inline-block}.side{display:none;position:absolute;z-index:5;inset:0 30% 0 0;background:var(--bg);padding:8px}.side.open{display:block}}
@media(prefers-color-scheme:dark){.m.u{background:#2b3f5c;color:#d6e6ff}}
.r{margin:0;padding:15px 0;border-bottom:1px solid var(--ln)}
.r .h{display:flex;align-items:center;gap:8px;color:var(--mu);font-size:.82rem}
.r .h img{width:18px;height:18px;border-radius:4px}
.r a.t{display:block;margin-top:3px;font-size:1.08rem;font-weight:500;color:var(--lk);text-decoration:none}
.r a.t:hover{text-decoration:underline}
.r p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:4px 0 0;color:var(--mu);font-size:.9rem}
:root{--lk:#2f5fa8}@media(prefers-color-scheme:dark){:root{--lk:#9ec1ff}}
.chip{background:#dbe8fb;color:#1f3a66;border:0;border-radius:12px;padding:7px 13px;margin:8px 6px 0 0;font-size:.85rem}
@media(prefers-color-scheme:dark){.chip{background:#2b3f5c;color:#d6e6ff}}
.vr{display:flex;gap:12px;align-items:flex-start}.vr img{width:84px;height:84px;object-fit:cover;border-radius:10px;flex:none}
.ico{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;padding:0;border-radius:50%;color:var(--mu);align-self:center;flex:none}
.ico:hover{background:var(--ln)}.ico.rec{color:#d64545;background:rgba(214,69,69,.14)}
#tg{width:auto;border-radius:12px;padding:0 12px;font-size:.95rem}
form.sb{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--ln);border-radius:30px;padding:4px 6px 4px 20px;width:100%}
form.sb:focus-within{border-color:var(--ac);box-shadow:0 2px 10px rgba(0,0,0,.10)}
form.sb input{border:0;background:none;border-radius:0;padding:11px 4px;flex:1;min-width:0;font-size:1rem}
form.sb input:focus{border:0}
.ico.go{background:#dbe8fb;color:#1f3a66;margin-left:2px}.ico.go:hover{background:#cadcf7}
@media(prefers-color-scheme:dark){.ico.go{background:#2b3f5c;color:#d6e6ff}.ico.go:hover{background:#34496a}}
.mi{max-width:100%;border-radius:10px;margin:6px 0;display:block}
.ig{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.ig img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer}
.m a,.card a{color:var(--lk)}sup a{text-decoration:none;font-size:.7rem;margin-left:1px}
.nw{padding:13px 0;border-bottom:1px solid var(--ln)}.nw .h{color:var(--mu);font-size:.8rem}
.nw a{display:block;margin-top:3px;color:var(--lk);font-weight:500;font-size:1.02rem;text-decoration:none}
.vd{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln)}
.vt{position:relative;flex:none;width:168px}.vt img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;display:block;background:var(--ln)}
.vt span{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.75);color:#fff;font-size:.72rem;padding:1px 6px;border-radius:5px}
.vd a.t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--lk);font-weight:500;text-decoration:none}
.vd .muted{margin-top:3px;font-size:.82rem}
@media(max-width:520px){.vt{width:136px}}
#toast{display:none;position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:90vw;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:.9rem;z-index:20}
#bar{position:sticky;top:0;z-index:6;background:var(--bg);padding:8px 0 4px;transition:transform .25s ease}
#bar.hide{transform:translateY(-120%)}
.tabs{margin-top:6px;overflow:visible;gap:2px}
.tabs button{flex:1;min-width:0;padding:8px 2px;font-size:clamp(.7rem,3.5vw,.95rem)}
@media(min-width:640px){.tabs button{flex:none;padding:8px 16px}}
.clamp{max-height:7.4em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 65%,transparent);mask-image:linear-gradient(#000 65%,transparent)}
</style>
</head>

  const ac=new (window.AudioContext||window.webkitAudioContext)(),b=await ac.decodeAudioData(await blob.arrayBuffer());ac.close();

async function voice(btn,inp,done){
  if(btn._s){btn._s();return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){toast('Spracheingabe wird in diesem Browser oder dieser Ansicht nicht unterstützt (https oder lokale Datei nötig).');return}
  let st;try{st=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){toast(e.name==='NotAllowedError'?(/^(file|content):/.test(location.protocol)?'Bei einer lokal geöffneten Datei erlaubt der Browser das Mikrofon nicht dauerhaft. Lege die Seite auf deinen Webspace (https), dann klappt es.':'Mikrofon blockiert. Tippe in der Adressleiste auf das Schloss und erlaube das Mikrofon.'):'Kein Mikrofon verfügbar.');return}
  const rec=new MediaRecorder(st),ch=[],ph=inp.placeholder;rec.ondataavailable=e=>e.data.size&&ch.push(e.data);
  const ac=new (window.AudioContext||window.webkitAudioContext)(),an=ac.createAnalyser();an.fftSize=1024;ac.createMediaStreamSource(st).connect(an);
  const buf=new Uint8Array(an.fftSize);let spoken=0,quiet=0;const t0=Date.now();
  const end=()=>{clearInterval(iv);btn._s=null;btn.classList.remove('rec');st.getTracks().forEach(t=>t.stop());ac.close();if(rec.state!=='inactive')rec.stop()};
  const iv=setInterval(()=>{an.getByteTimeDomainData(buf);let m=0;for(const v of buf)m=Math.max(m,Math.abs(v-128));
    if(m>10){spoken=1;quiet=0}else if(spoken&&++quiet>11)end();const t=Date.now()-t0;if(t>15000||(!spoken&&t>7000))end()},100);
  rec.onstop=async()=>{if(!spoken){toast('Nichts gehört. Bitte nochmal versuchen.');return}
    inp.placeholder='Verarbeite…';
    try{const t=(await gtxt([{inline_data:{mime_type:'audio/wav',data:await toWav(new Blob(ch))}},{text:'Transkribiere die Sprachaufnahme wörtlich (Deutsch, sonst in der gesprochenen Sprache). Antworte nur mit dem gesprochenen Text.'}])).trim();
      if(t){inp.value=t;done()}else toast('Nichts verstanden.')}catch(e){toast(fe(e.message))}
    inp.placeholder=ph};
  btn._s=end;btn.classList.add('rec');rec.start()}
